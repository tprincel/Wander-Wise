<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wander Wise</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
      background: #b3e5fc; font-family: 'Poppins', sans-serif;
    }
    .login-box {
      background: #fff; padding: 40px; border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 320px; text-align: center;
    }
    h2 { color: #1565c0; margin-bottom: 20px; }
    input {
      width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ccc;
      border-radius: 8px; font-size: 16px;
    }
    input[type="submit"] {
      width: 100%; background: linear-gradient(90deg, #42a5f5, #1e88e5);
      color: #fff; border: none; border-radius: 25px; font-size: 18px;
      font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    input[type="submit"]:hover {
      background: linear-gradient(90deg, #1e88e5, #1565c0); transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Wander Wise Login</h2>
    <form onsubmit="return validateForm(event)">
      <input type="text" id="username" placeholder="Enter Username" required>
      <input type="tel" id="phone" placeholder="Enter Phone Number" pattern="[0-9]{10}" required>
      <input type="email" id="email" placeholder="Enter Email" required>
      <input type="submit" value="Login">
    </form>
  </div>

  <script>
    async function validateForm(event) {
      if (event) event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const submitBtn = document.querySelector('input[type="submit"]');

      const phonePattern = /^[0-9]{10}$/;
      const emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;

      if (!username) {
        alert("Please enter your username.");
        return false;
      }
      if (!phonePattern.test(phone)) {
        alert("Enter a valid 10-digit phone number.");
        return false;
      }
      if (!emailPattern.test(email)) {
        alert("Enter a valid email address.");
        return false;
      }

      submitBtn.value = "Logging in...";
      submitBtn.disabled = true;

      try {
        const response = await fetch('auth_login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, phone, email })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store user profile in localStorage for use in dashboard
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          window.location.href = "dashboard.html";
        } else {
          // If server returned an error message
          alert(data.message || "Login failed. Please check your details.");
          submitBtn.value = "Login";
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.warn("Backend unavailable or static preview mode:", err);
        // Fallback for static preview without PHP running
        localStorage.setItem('currentUser', JSON.stringify({ username, phone, email }));
        window.location.href = "dashboard.html";
      }

      return false;
    }
  </script>
</body>
</html>
