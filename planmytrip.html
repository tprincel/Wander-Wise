<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Your Trip - Wander Wise</title>
  <style>
    /* Set baby blue background */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #b3e5fc; /* soft baby blue */
      font-family: 'Poppins', sans-serif;
    }

    /* Style the login button */
    a {
      text-decoration: none;
      font-size: 22px;
      font-weight: 600;
      color: white;
      padding: 15px 40px;
      border-radius: 30px;
      background: linear-gradient(90deg, #42a5f5, #1e88e5);
      transition: all 0.3s ease;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    a:hover {
      background: linear-gradient(90deg, #1e88e5, #1565c0);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <a href="login.html">Login to Continue</a>
</body>
</html>
