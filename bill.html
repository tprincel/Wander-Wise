<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - Wander Wise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a2a6c 0%, #2a3a7c 100%);
            color: #333;
        }
        .confirmation-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .success-badge {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .booking-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .home-btn {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .price-breakdown {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .price-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ced4da;
        }
    </style>
</head>
<body>
    <div class="confirmation-card">
        <h1>🎉 Booking Confirmed!</h1>
        <div class="success-badge">✅ Successfully Booked</div>
        
        <div class="booking-details" id="bookingDetails">
            <!-- Booking details will be loaded by JavaScript -->
        </div>
        
        <button class="home-btn" onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <script>
        // Load booking data from localStorage
        const bookingData = JSON.parse(localStorage.getItem('bookingData'));
        
        if (bookingData) {
            const detailsDiv = document.getElementById('bookingDetails');
            
            // Calculate the total amount
            const pricePerPerson = bookingData.package.price;
            const peopleCount = bookingData.peopleCount;
            const totalAmount = pricePerPerson * peopleCount;
            
            detailsDiv.innerHTML = `
                <h3>Booking Details:</h3>
                <p><strong>Booking Reference:</strong> <span style="color:#28a745; font-weight:bold; font-size:1.1em;">${bookingData.bookingId || ('WW' + (bookingData.rawBookingId || ''))}</span></p>
                ${bookingData.transactionId ? `<p><strong>Transaction ID:</strong> <code>${bookingData.transactionId}</code></p>` : ''}
                <p><strong>Customer Name:</strong> ${bookingData.customerName || bookingData.name}</p>
                <p><strong>Email:</strong> ${bookingData.customerEmail || bookingData.email}</p>
                <p><strong>Phone:</strong> ${bookingData.customerPhone || bookingData.phone}</p>
                <p><strong>Travel Date:</strong> ${bookingData.travelDate || bookingData.travel_date}</p>
                <p><strong>Number of People:</strong> ${bookingData.peopleCount || bookingData.guests}</p>
                <hr>
                <p><strong>Package:</strong> ${bookingData.package.name || bookingData.package.title}</p>
                <p><strong>Destination:</strong> ${bookingData.package.destination || bookingData.package.state_region}</p>
                <p><strong>Duration:</strong> ${bookingData.package.duration || bookingData.package.duration_days} days</p>
                
                <div class="price-breakdown">
                    <h4>Price Breakdown:</h4>
                    <div class="price-item">
                        <span>Price per person:</span>
                        <span>₹${pricePerPerson.toLocaleString()}</span>
                    </div>
                    <div class="price-item">
                        <span>Number of people:</span>
                        <span>${peopleCount}</span>
                    </div>
                    <div class="price-total">
                        <span>Total Amount:</span>
                        <span>₹${totalAmount.toLocaleString()}</span>
                    </div>
                </div>
            `;
        } else {
            document.getElementById('bookingDetails').innerHTML = 
                '<p>No booking data found. Please make a booking first.</p>';
        }
    </script>
</body>
</html>
