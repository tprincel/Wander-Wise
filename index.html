    }
    .link-fancy.plan-bottom {

    /* Scroll Carousel Container (Improved scrollbar visibility) */
    .scroll-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-top: 40px;
    }
    .scroll-container {
      display: flex;
      gap: 25px;
      overflow-x: auto; /* Enable horizontal scrolling */
      scroll-behavior: smooth;
      padding: 20px; /* Space for scrollbar and shadow */
      justify-content: flex-start;
      margin: 0 auto;
      min-height: 240px;
    }
   
    /* Scrollbar styling for all devices (made more prominent) */

        border-radius: 6px;

    .card {

    }
    .card img {

      height: 100%;

    }
    .card:hover img { transform: scale(1.05); }
    .overlay {

      bottom: -100%;
      left: 0;

  <script>
    const container = document.getElementById('carousel');
   
    // Fill the overlay text using data attributes after the content loads
    document.querySelectorAll('.overlay').forEach(overlayElement => {
        const name = overlayElement.getAttribute('data-name');
        overlayElement.innerHTML = `${name}<small>Click to Explore</small>`;
    });

    // Card unit width (320px card + 25px gap) = 345px
    const CARD_UNIT_WIDTH = 345;
    // Scroll jump amount (5 cards) for easier navigation.
    const SCROLL_JUMP_AMOUNT = CARD_UNIT_WIDTH * 5;

    function scrollLeft() {
      // Use the large jump amount for easier navigation
      container.scrollBy({ left: -SCROLL_JUMP_AMOUNT, behavior: 'smooth' });
    }

    function scrollRight() {
      // Use the large jump amount for easier navigation
      container.scrollBy({ left: SCROLL_JUMP_AMOUNT, behavior: 'smooth' });
    }

    // Display user profile in top-nav if logged in
    document.addEventListener('DOMContentLoaded', function() {
      try {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (user && user.username) {
          const nav = document.querySelector('.top-nav');
          const loginLink = nav ? nav.querySelector('a[href="login.html"]') : null;
          if (loginLink) {
            loginLink.textContent = `👤 ${user.username}`;
            loginLink.href = 'dashboard.html';
          }
        }
      } catch (e) {
        console.warn('User status notice:', e);
      }
    });
  </script>
